name: Chinese lint
description: Check Chinese wording in a file or directory.
inputs:
  path:
    description: File or directory to inspect.
    required: false
    default: .
  kind:
    description: Text kind accepted by chinese_lint.py.
    required: false
    default: all
  style:
    description: Writing style accepted by chinese_lint.py.
    required: false
    default: standard
  locale:
    description: Chinese locale accepted by chinese_lint.py.
    required: false
    default: auto
  fail_level:
    description: Lowest finding severity that makes the action fail.
    required: false
    default: error
  terms:
    description: Project JSON file containing preserve_translations entries.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check Chinese wording
      shell: bash
      env:
        CHINESE_LINT_PATH: ${{ inputs.path }}
        CHINESE_LINT_KIND: ${{ inputs.kind }}
        CHINESE_LINT_STYLE: ${{ inputs.style }}
        CHINESE_LINT_LOCALE: ${{ inputs.locale }}
        CHINESE_LINT_FAIL_LEVEL: ${{ inputs.fail_level }}
        CHINESE_LINT_TERMS: ${{ inputs.terms }}
      run: |
        arguments=(
          --kind "$CHINESE_LINT_KIND"
          --style "$CHINESE_LINT_STYLE"
          --locale "$CHINESE_LINT_LOCALE"
          --fail-level "$CHINESE_LINT_FAIL_LEVEL"
        )
        if [[ -n "$CHINESE_LINT_TERMS" ]]; then
          arguments+=(--terms "$CHINESE_LINT_TERMS")
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/chinese_lint.py" \
          "${arguments[@]}" "$CHINESE_LINT_PATH"
