name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate scripts and bundled data
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash -n install.sh
          shellcheck install.sh
          python3 scripts/test_chinese_lint.py
          LC_ALL=C PYTHONUTF8=0 PYTHONCOERCECLOCALE=0 \
            python3 scripts/test_chinese_lint.py
          python3 scripts/test_install.py
          python3 scripts/test_lexicons.py
          python3 scripts/test_corpora.py
          python3 scripts/test_integrations.py
          python3 scripts/sync_lexicons.py --verify
          python3 scripts/validate_repository.py --release
          python3 scripts/chinese_lint.py --locale zh-TW \
            --exclude 'README.zh-CN.md' \
            --exclude 'lexicons/*' --exclude '*/lexicons/*' .
          python3 scripts/chinese_lint.py --kind prose --style readme \
            --locale zh-CN README.zh-CN.md
      - name: Exercise reusable Chinese lint action
        uses: ./
        with:
          path: README.md
          kind: prose
          style: readme
          locale: zh-TW
